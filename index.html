<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Матрица</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--tg-theme-bg-color,#101925);color:var(--tg-theme-text-color,#f4f6fb);padding:20px}h2{margin:0 0 8px}p{color:var(--tg-theme-hint-color,#aab7c6);margin:0 0 20px}.panel{max-width:480px;margin:auto}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;touch-action:none;user-select:none}.cell{aspect-ratio:1;border:1px solid #50627a;border-radius:5px;background:#263449}.cell.active{background:#3295ed;border-color:#75bfff}.stats{display:flex;justify-content:space-around;padding:20px 0;font-size:18px}.stats strong{font-size:25px}button{border:0;background:var(--tg-theme-button-color,#3295ed);color:var(--tg-theme-button-text-color,white);border-radius:12px;padding:15px;font-weight:700;font-size:16px;width:100%;cursor:pointer}.matrix{display:grid;gap:7px;margin:20px 0}.matrix input{width:100%;min-width:0;padding:10px 2px;text-align:center;font-size:16px;border:1px solid #5b6c80;border-radius:7px;background:#243348;color:white}#entry{display:none}.secondary{margin-top:10px;background:#334358}
</style></head><body><div class="panel"><section id="choose"><h2>Выберите размер матрицы</h2><p>Проведите пальцем или мышкой по клеткам (до 8 × 8).</p><div class="grid" id="grid"></div><div class="stats"><span>Строк: <strong id="r">3</strong></span><span>Столбцов: <strong id="c">3</strong></span></div><button id="next">Продолжить</button></section><section id="entry"><h2 id="heading">Заполните матрицу</h2><p>Введите числа в ячейки.</p><div class="matrix" id="matrix"></div><button id="send">Отправить матрицу</button><button class="secondary" id="back">Назад</button></section></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let rows=3,cols=3,dragging=false;const grid=document.getElementById('grid');function paint(){document.getElementById('r').textContent=rows;document.getElementById('c').textContent=cols;[...grid.children].forEach((el,i)=>el.classList.toggle('active',Math.floor(i/8)<rows&&i%8<cols))}function select(e){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(el&&grid.contains(el)){rows=Number(el.dataset.r);cols=Number(el.dataset.c);paint()}}for(let r=1;r<=8;r++)for(let c=1;c<=8;c++){const el=document.createElement('div');el.className='cell';el.dataset.r=r;el.dataset.c=c;grid.appendChild(el)}grid.addEventListener('pointerdown',e=>{dragging=true;grid.setPointerCapture(e.pointerId);select(e)});grid.addEventListener('pointermove',e=>{if(dragging)select(e)});grid.addEventListener('pointerup',()=>dragging=false);grid.addEventListener('pointercancel',()=>dragging=false);paint();document.getElementById('next').onclick=()=>{document.getElementById('choose').style.display='none';document.getElementById('entry').style.display='block';document.getElementById('heading').textContent=`Матрица ${rows} × ${cols}`;const m=document.getElementById('matrix');m.innerHTML='';m.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;for(let i=0;i<rows*cols;i++){const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.placeholder='0';input.setAttribute('aria-label',`Строка ${Math.floor(i/cols)+1}, столбец ${i%cols+1}`);m.appendChild(input)}};document.getElementById('back').onclick=()=>{document.getElementById('entry').style.display='none';document.getElementById('choose').style.display='block'};document.getElementById('send').onclick=()=>{const inputs=[...document.querySelectorAll('#matrix input')];const nums=inputs.map(x=>Number(x.value.trim().replace(',','.')));if(inputs.some(x=>!x.value.trim())||nums.some(n=>!Number.isFinite(n))){alert('Заполните все ячейки корректными числами');return}const matrix=Array.from({length:rows},(_,i)=>nums.slice(i*cols,(i+1)*cols));if(tg?.sendData){tg.sendData(JSON.stringify({matrix}));}else{alert('Для отправки откройте приложение из Telegram. Матрица: '+JSON.stringify(matrix))}};
</script></body></html>
